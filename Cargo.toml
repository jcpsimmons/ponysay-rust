[package]
name = "ponysay-rust"
version = "4.0.0"
edition = "2021"
rust-version = "1.85"
description = "Native Rust ponysay with bundled ponies, quotes and balloons"
license = "GPL-3.0-or-later"
repository = "https://github.com/jcpsimmons/ponysay-rust"
build = "rust/build.rs"

[[bin]]
name = "ponysay"
path = "rust/src/main.rs"

[dependencies]
unicode-width = "0.2"
terminal_size = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
